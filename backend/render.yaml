# Render Blueprint for the Chitti backend. In Render: New > Blueprint, pick this repo and set the
# Blueprint file path to backend/render.yaml. Secrets (sync: false) are entered in the dashboard.
services:
  - type: web
    name: chitti-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: chitti
      - key: FIREBASE_PROJECT_ID
        value: chitti-bd8ce
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: MAX_BACKUP_BYTES
        value: "52428800"
